[package]
name = "solar-magic"
description = "Solar Magic: a Super Mario World level viewer and (eventually) editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "solar-magic"
path = "src/main.rs"

[features]
default = ["gamepad"]
# Gamepad input in the Play panel: Xbox, DualSense, Steam Input and any pad in
# the SDL controller database (gilrs; needs libudev-dev on Linux).
gamepad = ["dep:gilrs"]

[dependencies]
anyhow.workspace = true
cpal.workspace = true
gilrs = { workspace = true, optional = true }
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
ips.workspace = true
rfd.workspace = true
rtrb.workspace = true
serde.workspace = true
serde_json.workspace = true
smw-data.workspace = true
smw-play.workspace = true
smw-render.workspace = true
snes-core.workspace = true
snes-rom.workspace = true
w65c816.workspace = true

[lints]
workspace = true
